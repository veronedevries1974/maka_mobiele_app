<div class="page_framework"> 
  <div class="navigation"> 
    <ul> 
      <li><a routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }" (click)="sluitMenu()">home</a></li> 
      <li><a routerLink="/child" routerLinkActive="active-link" (click)="sluitMenu()">prijslijst</a></li> 
      <li>
        <!-- GECORRIGEERD: Linkt nu naar /child2 (activiteiten) en blijft actief bij subpagina's -->
        <a routerLink="/child2" 
           routerLinkActive="active-link" 
           [routerLinkActiveOptions]="{ exact: false }"
           (click)="toggleMenu($event)">
           activiteiten
        </a>
        <ul class="submenu" *ngIf="menuOpen">
          <!-- GECORRIGEERD: Paden aangepast naar de nieuwe routing-structuur -->
          <li><a routerLink="/child2/wandelen" routerLinkActive="active-sub-link" (click)="sluitMenu()">Wandelen</a></li>
          <li><a routerLink="/child2/kanoen" routerLinkActive="active-sub-link" (click)="sluitMenu()">Kanoën</a></li> 
        </ul>
      </li>
    </ul>
  </div>

  <div class="page-content">
    <router-outlet></router-outlet>
    <app-footer></app-footer>
  </div>
</div>
